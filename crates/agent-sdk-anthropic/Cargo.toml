[package]
name = "agent-sdk-anthropic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Anthropic Messages API provider for agent-sdk."

[dependencies]
agent-sdk-language-model = { path = "../agent-sdk-language-model", version = "0.1.0" }

async-trait = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
pin-project-lite = "0.2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true }
wiremock = "0.6"
